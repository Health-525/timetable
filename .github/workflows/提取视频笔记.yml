name: 提取视频笔记

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube 视频链接（必填）'
        required: true
      out_dir:
        description: '输出目录（默认 youtube-daily）'
        required: false
        default: 'youtube-daily'

permissions:
  contents: write

concurrency:
  group: timetable-video-note
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true

      - name: 写入 YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt

      - name: 提取字幕并生成笔记
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
          STUDY_REPO: 'https://github.com/Health-525/jiangshu-study.git'
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          OUT_DIR_REL: ${{ github.event.inputs.out_dir }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          YOUTUBE_COOKIES_FILE: youtube_cookies.txt
        run: |
          node scripts/fetch_video_note.js

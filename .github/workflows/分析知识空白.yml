name: 分析知识空白

on:
  schedule:
    # 每周一、周四 北京时间 21:00 = UTC 13:00
    - cron: "0 13 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-analysis
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          rm -rf _study
          git clone "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" _study
          cd _study
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 分析知识空白
        env:
          STUDY_DIR: _study
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: node scripts/analyze_knowledge.js

      - name: 提交分析结果
        run: |
          git add -f _out/learning_gaps.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "feat: update knowledge gap analysis"
            git push
          fi

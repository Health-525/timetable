name: 处理调课

on:
  repository_dispatch:
    types: [adjustments-push]
  workflow_dispatch:

concurrency:
  group: timetable-adjustments-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: node scripts/ci/clone-study-repo.js

      - name: 检查调课.md是否存在
        id: check
        run: |
          if [ -f "_study/09-日常处理/调课.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "调课.md 不存在，跳过"
          fi

      - name: 解析调课.md，更新 adjustments.json
        if: steps.check.outputs.exists == 'true'
        run: |
          node scripts/parse_adjustments.js \
            --note _study/09-日常处理/调课.md \
            --adj data/adjustments.json

      - name: 提交 adjustments.json 到 timetable
        if: steps.check.outputs.exists == 'true'
        env:
          PUBLISH_MODE: origin
          PUBLISH_REPO_DIR: .
          PUBLISH_ADD_PATH: data/adjustments.json
          PUBLISH_COMMIT_MESSAGE: 'feat: apply schedule adjustments from Obsidian'
        run: node scripts/ci/publish-with-rebase.js

      - name: 将更新后的调课.md 推送回 jiangshu-study
        if: steps.check.outputs.exists == 'true'
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
          PUBLISH_MODE: study
          PUBLISH_REPO_DIR: _study
          PUBLISH_ADD_PATH: 09-日常处理/调课.md
          PUBLISH_COMMIT_MESSAGE: 'chore: archive processed adjustments'
        run: node scripts/ci/publish-with-rebase.js

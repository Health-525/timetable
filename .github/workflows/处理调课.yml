name: 处理调课

on:
  repository_dispatch:
    types: [adjustments-push]
  workflow_dispatch:

concurrency:
  group: adjustments-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" _study
          cd _study
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 检查调课.md是否存在
        id: check
        run: |
          if [ -f "_study/09-日常处理/调课.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "调课.md 不存在，跳过"
          fi

      - name: 解析调课.md，更新 adjustments.json
        if: steps.check.outputs.exists == 'true'
        run: |
          node scripts/parse_adjustments.js \
            --note _study/09-日常处理/调课.md \
            --adj data/adjustments.json

      - name: 提交 adjustments.json 到 timetable
        if: steps.check.outputs.exists == 'true'
        run: |
          git add data/adjustments.json
          if git diff --cached --quiet; then
            echo "adjustments.json 无变化，跳过"
          else
            git commit -m "feat: apply schedule adjustments from Obsidian"
            git pull --rebase --no-autostash origin main || echo "Pull failed, will force push"
            git push --force-with-lease
          fi

      - name: 将更新后的调课.md 推送回 jiangshu-study
        if: steps.check.outputs.exists == 'true'
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          cd _study
          git add 09-日常处理/调课.md
          if git diff --cached --quiet; then
            echo "调课.md 无变化，跳过"
          else
            git commit -m "chore: archive processed adjustments"
            git pull --rebase --no-autostash "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" main || echo "Pull failed, will force push"
            git push --force-with-lease "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" HEAD:main
          fi

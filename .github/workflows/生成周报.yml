name: 生成周报

on:
  schedule:
    # 每周日北京时间 22:30 = UTC 14:30
    - cron: "30 14 * * 0"
  workflow_dispatch:

concurrency:
  group: study-weekly-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: node scripts/ci/clone-study-repo.js

      - name: 生成周报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: node scripts/generate-weekly.js

      - name: 提交周报
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
          PUBLISH_MODE: study
          PUBLISH_REPO_DIR: _study
          PUBLISH_ADD_PATH: 周报/
          PUBLISH_COMMIT_MESSAGE: 'weekly: ${{ github.run_id }}'
        run: node scripts/ci/publish-with-rebase.js

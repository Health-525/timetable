name: 生成周报

on:
  schedule:
    # 每周日北京时间 22:30 = UTC 14:30
    - cron: "30 14 * * 0"
  workflow_dispatch:

concurrency:
  group: study-weekly-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          rm -rf _study
          git clone "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" _study
          cd _study
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 生成周报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: node scripts/generate-weekly.js

      - name: 提交周报
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          cd _study
          git add 周报/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无新的周报"
          else
            range=$(node -e "const now=new Date(Date.now()+8*3600*1000); const day=now.getUTCDay(); const daysFromMonday=day===0?6:day-1; const monday=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-daysFromMonday*86400000); const sunday=new Date(monday.getTime()+6*86400000); const fmt=d=>[d.getUTCFullYear(),String(d.getUTCMonth()+1).padStart(2,'0'),String(d.getUTCDate()).padStart(2,'0')].join('-'); process.stdout.write(fmt(monday) + ' to ' + fmt(sunday));")
            git commit -m "weekly: ${range}"
            git push "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" HEAD:main
          fi

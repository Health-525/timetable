name: 处理作业

on:
  repository_dispatch:
    types: [assignments-push]
  schedule:
    # 每天 22:00 UTC (北京时间次日 06:00) 更新倒计时
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: assignments-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" _study
          cd _study
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 解析作业.md，更新 assignments.json
        run: |
          if [ -f "_study/09-日常处理/作业.md" ]; then
            node scripts/parse_assignments.js \
              --note _study/09-日常处理/作业.md \
              --data data/assignments.json
          else
            echo "作业.md 不存在，跳过"
          fi

      - name: 提交 assignments.json 到 timetable
        run: |
          git add data/assignments.json
          if git diff --cached --quiet; then
            echo "assignments.json 无变化，跳过"
          else
            git commit -m "feat: update assignments from Obsidian"
            git pull --rebase --no-autostash origin main || echo "Pull failed, will force push"
            git push --force-with-lease
          fi

      - name: 将更新后的作业.md 推送回 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          cd _study
          git add 09-日常处理/作业.md
          if git diff --cached --quiet; then
            echo "作业.md 无变化，跳过"
          else
            git commit -m "chore: update 作业.md reminder list"
            git fetch "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" main
            git rebase --no-autostash origin/main || echo "Rebase failed, will force push"
            git push "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" HEAD:main
          fi

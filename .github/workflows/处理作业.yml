name: 处理作业

on:
  repository_dispatch:
    types: [assignments-push]
  schedule:
    # 每天 22:00 UTC (北京时间次日 06:00) 更新倒计时
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: timetable-assignments-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: node scripts/ci/clone-study-repo.js

      - name: 解析作业.md，更新 assignments.json
        run: |
          if [ -f "_study/09-日常处理/作业.md" ]; then
            node scripts/parse_assignments.js \
              --note _study/09-日常处理/作业.md \
              --data data/assignments.json
          else
            echo "作业.md 不存在，跳过"
          fi

      - name: 提交 assignments.json 到 timetable
        env:
          PUBLISH_MODE: origin
          PUBLISH_REPO_DIR: .
          PUBLISH_ADD_PATH: data/assignments.json
          PUBLISH_COMMIT_MESSAGE: feat: update assignments from Obsidian
        run: node scripts/ci/publish-with-rebase.js

      - name: 将更新后的作业.md 推送回 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
          PUBLISH_MODE: study
          PUBLISH_REPO_DIR: _study
          PUBLISH_ADD_PATH: 09-日常处理/作业.md
          PUBLISH_COMMIT_MESSAGE: chore: update 作业.md reminder list
        run: node scripts/ci/publish-with-rebase.js

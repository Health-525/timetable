name: 处理阳光长跑

on:
  repository_dispatch:
    types: [running-push]
  workflow_dispatch:

# 同一类运行串行执行，避免并发写回 running 数据
concurrency:
  group: timetable-running-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          rm -rf _study
          git clone "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" _study
          cd _study
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 解析阳光长跑.md，更新 running.json
        run: |
          if [ -f "_study/09-日常处理/阳光长跑.md" ]; then
            node scripts/parse_running.js \
              --note _study/09-日常处理/阳光长跑.md \
              --data data/running.json
          else
            echo "阳光长跑.md 不存在，跳过"
          fi

      - name: 提交 running.json 到 timetable
        run: |
          git add data/running.json
          if git diff --cached --quiet; then
            echo "running.json 无变化，跳过"
          else
            git commit -m "feat: update running from Obsidian"
            git pull --rebase --no-autostash origin main || echo "Pull failed, will force push"
            pushed=0
            for i in 1 2 3; do
              git pull --rebase origin main
              git push --force-with-lease && pushed=1 && break
              echo 'push rejected, retrying...'
              sleep 2
            done
            if [ "$pushed" != "1" ]; then
              echo 'push failed after retries'
              exit 1
            fi
          fi

      - name: 将更新后的阳光长跑.md 推送回 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          cd _study
          git add 09-日常处理/阳光长跑.md
          if git diff --cached --quiet; then
            echo "阳光长跑.md 无变化，跳过"
          else
            git commit -m "chore: update 阳光长跑.md heatmap"
            git fetch "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" main
            git rebase --no-autostash origin/main || echo "Rebase failed, will force push"
            git push "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" HEAD:main
          fi

name: 处理阳光长跑

on:
  repository_dispatch:
    types: [running-push]
  workflow_dispatch:

# 同一类运行串行执行，避免并发写回 running 数据
concurrency:
  group: timetable-running-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: node scripts/ci/clone-study-repo.js

      - name: 解析阳光长跑.md，更新 running.json
        run: |
          if [ -f "_study/09-日常处理/阳光长跑.md" ]; then
            node scripts/parse_running.js \
              --note _study/09-日常处理/阳光长跑.md \
              --data data/running.json
          else
            echo "阳光长跑.md 不存在，跳过"
          fi

      - name: 提交 running.json 到 timetable
        env:
          PUBLISH_MODE: origin
          PUBLISH_REPO_DIR: .
          PUBLISH_ADD_PATH: data/running.json
          PUBLISH_COMMIT_MESSAGE: 'feat: update running from Obsidian'
        run: node scripts/ci/publish-with-rebase.js

      - name: 将更新后的阳光长跑.md 推送回 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
          PUBLISH_MODE: study
          PUBLISH_REPO_DIR: _study
          PUBLISH_ADD_PATH: 09-日常处理/阳光长跑.md
          PUBLISH_COMMIT_MESSAGE: 'chore: update 阳光长跑.md heatmap'
        run: node scripts/ci/publish-with-rebase.js

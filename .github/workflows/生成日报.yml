name: 生成日报

on:
  schedule:
    # 每天北京时间 08:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: study-daily-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - uses: ./.github/actions/study-setup
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 生成日报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: node scripts/generate-daily.js

      - name: 提交日报
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
          PUBLISH_MODE: study
          PUBLISH_REPO_DIR: _study
          PUBLISH_ADD_PATH: 日报/
          PUBLISH_COMMIT_MESSAGE: 'daily: ${{ github.run_id }} 日报自动生成'
        run: node scripts/ci/publish-with-rebase.js

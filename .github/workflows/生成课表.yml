name: 生成课表

on:
  schedule:
    # 每天北京时间 06:00 = UTC 22:00（前一天）
    - cron: "0 22 * * *"
  repository_dispatch:
    types: [timetable-push]
  workflow_dispatch:

concurrency:
  group: timetable-main-write
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 jiangshu-study 仓库
        uses: actions/checkout@v4
        with:
          repository: Health-525/jiangshu-study
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 拉取 timetable 数据
        uses: actions/checkout@v4
        with:
          repository: Health-525/timetable
          path: _timetable
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成课表.md
        run: |
          node _timetable/scripts/generate-timetable.js \
            _timetable/data/schedule.json \
            _timetable/data/adjustments.json \
            09-日常处理/课表.md

      - name: 推送课表.md 到 jiangshu-study
        run: |
          if git diff --quiet; then
            echo "课表无变化，跳过"
          else
            git config user.name "timetable-bot"
            git config user.email "timetable-bot@users.noreply.github.com"
            git add 09-日常处理/课表.md
            git commit -m "chore: 自动更新课表"
            git fetch origin main
            git rebase --no-autostash origin/main || echo "Rebase failed, will force push"
            pushed=0
            for i in 1 2 3; do
              git pull --rebase origin main
              git push && pushed=1 && break
              echo 'push rejected, retrying...'
              sleep 2
            done
            if [ "$pushed" != "1" ]; then
              echo 'push failed after retries'
              exit 1
            fi
          fi

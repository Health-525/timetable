name: 生成课表

on:
  schedule:
    # 每天北京时间 06:00 = UTC 22:00（前一天）
    - cron: "0 22 * * *"
  repository_dispatch:
    types: [timetable-push]
  workflow_dispatch:

concurrency:
  group: study-timetable-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 jiangshu-study 仓库
        uses: actions/checkout@v4
        with:
          repository: Health-525/jiangshu-study
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 拉取 timetable 数据
        uses: actions/checkout@v4
        with:
          repository: Health-525/timetable
          path: _timetable
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成课表.md
        run: |
          node _timetable/scripts/generate-timetable.js \
            _timetable/data/schedule.json \
            _timetable/data/adjustments.json \
            09-日常处理/课表.md

      - name: 推送课表.md 到 jiangshu-study
        env:
          PUBLISH_MODE: origin
          PUBLISH_REPO_DIR: .
          PUBLISH_ADD_PATH: 09-日常处理/课表.md
          PUBLISH_COMMIT_MESSAGE: chore: 自动更新课表
        run: node _timetable/scripts/ci/publish-with-rebase.js

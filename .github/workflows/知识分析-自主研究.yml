name: 知识分析 → 自主研究

on:
  schedule:
    # 每天 北京时间 21:00 = UTC 13:00
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      gap_id:
        description: '指定 gap ID（留空则自动选优先级最高）'
        required: false

permissions:
  contents: write

concurrency:
  group: timetable-main-write
  cancel-in-progress: true

jobs:
  # ── Job 1: 知识空白分析 ──
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          rm -rf _study
          git clone "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" _study
          cd _study
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 分析知识空白
        env:
          STUDY_DIR: _study
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: node scripts/analyze_knowledge.js

      - name: 提交分析结果 + Agent 状态
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -f _out/learning_gaps.json _state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "feat: update knowledge gap analysis + agent state"
            pushed=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main
              git push && pushed=1 && break
              echo 'push rejected, retrying...'
              sleep 2
            done
            if [ "$pushed" != "1" ]; then
              echo 'push failed after retries'
              exit 1
            fi
          fi

  # ── Job 2: 自主研究（依赖 analyze 完成） ──
  research:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库（含最新的 learning_gaps.json）
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: 对齐最新 main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "origin/main=$(git rev-parse origin/main)"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: |
          rm -rf _study
          git clone "https://x-access-token:${STUDY_PUSH_TOKEN}@github.com/Health-525/jiangshu-study.git" _study
          cd _study
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"

      - name: 运行自主研究
        env:
          STUDY_DIR: _study
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GAP_ID: ${{ github.event.inputs.gap_id }}
        run: node scripts/auto_research.js

      - name: 提交 gap 状态 + Agent 状态
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -f _out/learning_gaps.json _state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "feat: update gap status + agent state after auto research"
            pushed=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main
              git push && pushed=1 && break
              echo 'push rejected, retrying...'
              sleep 2
            done
            if [ "$pushed" != "1" ]; then
              echo 'push failed after retries'
              exit 1
            fi
          fi

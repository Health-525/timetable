name: 知识分析 → 自主研究

on:
  schedule:
    # 每天 北京时间 21:00 = UTC 13:00
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      gap_id:
        description: '指定 gap ID（留空则自动选优先级最高）'
        required: false

permissions:
  contents: write

concurrency:
  group: timetable-knowledge-pipeline
  cancel-in-progress: false

jobs:
  # ── Job 1: 知识空白分析 ──
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - uses: ./.github/actions/study-setup
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}

      - name: 分析知识空白
        env:
          STUDY_DIR: _study
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: node scripts/analyze_knowledge.js

      - name: 提交分析结果 + Agent 状态
        env:
          PUBLISH_MODE: origin
          PUBLISH_REPO_DIR: .
          PUBLISH_ADD_PATH: -f _out/learning_gaps.json _state/
          PUBLISH_COMMIT_MESSAGE: 'feat: update knowledge gap analysis + agent state'
        run: node scripts/ci/publish-with-rebase.js

  # ── Job 2: 自主研究（依赖 analyze 完成） ──
  research:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 timetable 仓库（含最新数据）
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.STUDY_PUSH_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: 对齐最新 main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 克隆 jiangshu-study
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
        run: node scripts/ci/clone-study-repo.js

      - name: 运行自主研究
        env:
          STUDY_DIR: _study
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GAP_ID: ${{ github.event.inputs.gap_id }}
        run: node scripts/auto_research.js

      - name: 提交自主研究笔记
        env:
          STUDY_PUSH_TOKEN: ${{ secrets.STUDY_PUSH_TOKEN }}
          PUBLISH_MODE: study
          PUBLISH_REPO_DIR: _study
          PUBLISH_ADD_PATH: 08-AI学习/自主研究
          PUBLISH_COMMIT_MESSAGE: 'feat(auto_research): publish autonomous research note'
        run: node scripts/ci/publish-with-rebase.js

      - name: 提交 gap 状态 + Agent 状态
        env:
          PUBLISH_MODE: origin
          PUBLISH_REPO_DIR: .
          PUBLISH_ADD_PATH: -f _out/learning_gaps.json _state/
          PUBLISH_COMMIT_MESSAGE: 'feat: update gap status + agent state after auto research'
        run: node scripts/ci/publish-with-rebase.js
